<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptVault — AI Prompts Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">PromptVault</span>
    </div>
    <nav class="nav">
      <a href="#prompts" class="nav-link">Prompts</a>
      <a href="#categories" class="nav-link">Categories</a>
      <span class="nav-badge">New Daily</span>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg-grid"></div>
  <div class="hero-content">
    <div class="hero-tag">🔥 Trending Prompts</div>
    <h1 class="hero-title">
      Best AI Prompts<br>
      <span class="hero-accent">For Every Creator</span>
    </h1>
    <p class="hero-sub">Photo edits · Fashion · Business · Study · Art</p>

    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="Search prompts...">
      <span class="search-icon">🔍</span>
    </div>
  </div>
  <div class="hero-count-wrap">
    <div class="hero-count" id="totalCount">0</div>
    <div class="hero-count-label">Prompts Available</div>
  </div>
</section>

<!-- CATEGORIES -->
<section class="categories-section" id="categories">
  <div class="container">
    <div class="cat-scroll" id="catFilter">
      <button class="cat-btn active" data-cat="all">✨ All</button>
    </div>
  </div>
</section>

<!-- PROMPTS GRID -->
<section class="prompts-section" id="prompts">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">All Prompts</h2>
      <span class="results-count" id="resultsCount"></span>
    </div>
    <div class="prompts-grid" id="promptsGrid">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading prompts...</p>
      </div>
    </div>
  </div>
</section>

<!-- COPY TOAST -->
<div class="toast" id="toast">✅ Copied to clipboard!</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <div class="footer-inner">
      <div class="logo">⚡ PromptVault</div>
      <p class="footer-text">Follow on Instagram for daily new prompts</p>
      <a class="insta-btn" href="https://instagram.com" target="_blank">📸 @YourHandle</a>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
