<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — PromptVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="logo">⚡ PromptVault</div>
    <h2 class="login-title">Admin Login</h2>
    <input class="admin-input" id="loginPass" type="password" placeholder="Enter Password">
    <button class="btn-primary" onclick="doLogin()">Login →</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">

  <!-- DESKTOP SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">⚡ Admin</div>
    <nav class="sidebar-nav">
      <a class="side-link active" onclick="showTab('add', this)" href="#">➕ Add Prompt</a>
      <a class="side-link" onclick="showTab('manage', this)" href="#">📋 Manage</a>
      <a class="side-link" onclick="showTab('stats', this)" href="#">📊 Stats</a>
      <a class="side-link logout" onclick="doLogout()" href="#">🚪 Logout</a>
    </nav>

    <!-- SERVER STATUS WIDGET -->
    <div class="server-status" id="serverStatus">
      <div class="ss-dot" id="ssDot"></div>
      <div class="ss-info">
        <span class="ss-label" id="ssLabel">Server starting...</span>
        <div class="ss-bar-wrap">
          <div class="ss-bar" id="ssBar"></div>
        </div>
        <span class="ss-timer" id="ssTimer">~30s</span>
      </div>
    </div>
  </aside>

  <main class="admin-main">

    <!-- ADD PROMPT TAB -->
    <div id="tab-add" class="tab-content active">
      <h1 class="admin-page-title">Add New Prompt</h1>
      <div class="form-card">
        <div class="form-row">
          <div class="form-group">
            <label>Title</label>
            <input class="admin-input" id="promptTitle" placeholder="e.g. Cinematic Portrait Edit">
          </div>
          <div class="form-group">
            <label>Category</label>
            <input class="admin-input" id="promptCategory" placeholder="e.g. Photo Edit, Fashion, Business">
          </div>
        </div>
        <div class="form-group">
          <label>Label / Tag</label>
          <input class="admin-input" id="promptLabel" placeholder="e.g. Trending, New, Free">
        </div>
        <div class="form-group">
          <label>Prompt Text</label>
          <textarea class="admin-textarea" id="promptText" placeholder="Write the full prompt here..."></textarea>
        </div>
        <div class="form-row">
          <button class="btn-primary" onclick="savePrompt()">💾 Save Prompt</button>
          <button class="btn-secondary" onclick="clearForm()">🗑 Clear</button>
        </div>
        <div class="save-msg" id="saveMsg"></div>
      </div>
    </div>

    <!-- MANAGE TAB -->
    <div id="tab-manage" class="tab-content">
      <div class="tab-header">
        <h1 class="admin-page-title">Manage Prompts</h1>
        <input class="admin-input search-sm" id="manageSearch" placeholder="Search..." oninput="filterManage()">
      </div>
      <div id="manageList" class="manage-list"></div>
    </div>

    <!-- STATS TAB -->
    <div id="tab-stats" class="tab-content">
      <h1 class="admin-page-title">Stats</h1>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

  </main>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-nav">
    <div class="mobile-nav-inner">
      <button class="mobile-nav-btn active" id="mnav-add" onclick="showTab('add', this, true)">
        <span class="nav-icon">➕</span>Add
      </button>
      <button class="mobile-nav-btn" id="mnav-manage" onclick="showTab('manage', this, true)">
        <span class="nav-icon">📋</span>Manage
      </button>
      <button class="mobile-nav-btn" id="mnav-stats" onclick="showTab('stats', this, true)">
        <span class="nav-icon">📊</span>Stats
      </button>
      <button class="mobile-nav-btn logout-m" onclick="doLogout()">
        <span class="nav-icon">🚪</span>Logout
      </button>
    </div>
  </nav>

</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2 class="modal-title">Edit Prompt</h2>
    <input class="admin-input" id="editTitle" placeholder="Title">
    <input class="admin-input" id="editCategory" placeholder="Category">
    <input class="admin-input" id="editLabel" placeholder="Label">
    <textarea class="admin-textarea" id="editText" placeholder="Prompt..."></textarea>
    <input type="hidden" id="editId">
    <div class="modal-actions">
      <button class="btn-primary" onclick="updatePrompt()">✅ Update</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
